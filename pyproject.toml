[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sarvam-tts"
version = "1.0.0"
description = "A Python client for Sarvam AI text-to-speech that supports multilingual Indian language synthesis."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Sujal Rajpoot", email = "sujalrajpoot70@gmail.com" }
]
keywords = [
  "sarvam",
  "sarvam-ai",
  "sarvam-ai-tts",
  "sarvam-ai-tts-python",
  "sarvam-ai-tts-python-sdk",
  "sarvamai-tts",
  "sarvamai-tts-python",
  "sarvamai-tts-python-sdk",
  "tts",
  "text-to-speech",
  "speech-synthesis",
  "indian-languages",
  "multilingual",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/sujalrajpoot/sarvam-tts"
Documentation = "https://github.com/sujalrajpoot/sarvam-tts#readme"
Source = "https://github.com/sujalrajpoot/sarvam-tts"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sarvam_tts", "sarvam_tts.*"]
