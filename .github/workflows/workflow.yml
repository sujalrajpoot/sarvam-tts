name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate imports
        run: |
          python - <<'PY'
          from sarvam_tts import SarvamTTS, TTSConfig, TTSException, TTSRequestError
          print(SarvamTTS.__name__)
          print(TTSConfig.__name__)
          print(TTSException.__name__)
          print(TTSRequestError.__name__)
          PY

      - name: Compile package files
        run: python -m compileall sarvam_tts
